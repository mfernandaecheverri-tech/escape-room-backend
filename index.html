<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escape Room - 16 Bit Edition</title>
  <!-- Fuente Retro 16-bits -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', cursive;
      image-rendering: pixelated; /* Mantiene bordes nítidos de 16-bit */
    }

    body {
      background-color: #0d0d15;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Contenedor Principal con marco retro */
    #game-container {
      width: 960px;
      height: 600px;
      background-color: #1a1a24;
      border: 6px solid #4a4a68;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px #000;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Encabezado HUD */
    header {
      background-color: #2b2b3a;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #4a4a68;
      font-size: 12px;
    }

    .timer {
      color: #ff4757;
      text-shadow: 2px 2px #000;
    }

    .room-code {
      color: #2ed573;
    }

    /* Área del Escenario / Canvas */
    #main-stage {
      flex: 1;
      position: relative;
      background: #111118;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Secciones intercambiables */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }

    /* Botones Retro */
    .btn-pixel {
      background-color: #ff6b81;
      color: #fff;
      border: none;
      padding: 12px 20px;
      margin: 10px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 #b33939;
      transition: all 0.1s;
    }

    .btn-pixel:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 #b33939;
    }

    .btn-pixel.green {
      background-color: #2ed573;
      box-shadow: 0 5px 0 #20bf6b;
    }

    /* Inputs Pixelated */
    input[type="text"] {
      background: #000;
      border: 3px solid #4a4a68;
      color: #2ed573;
      padding: 10px;
      font-size: 14px;
      text-align: center;
      margin: 10px;
      outline: none;
    }

    /* HUD Inferior: Inventario e Historial */
    footer {
      height: 120px;
      background-color: #2b2b3a;
      border-top: 4px solid #4a4a68;
      display: flex;
      padding: 10px;
      gap: 10px;
    }

    .inventory-panel {
      flex: 1;
      border: 2px dashed #4a4a68;
      padding: 8px;
    }

    .inventory-title {
      font-size: 10px;
      color: #eccc68;
      margin-bottom: 8px;
    }

    .inventory-slots {
      display: flex;
      gap: 10px;
    }

    .slot {
      width: 40px;
      height: 40px;
      background-color: #1a1a24;
      border: 2px solid #57606f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .log-panel {
      flex: 1;
      border: 2px solid #4a4a68;
      background: #000;
      padding: 8px;
      font-size: 8px;
      line-height: 1.4;
      overflow-y: auto;
      color: #ffa502;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Barra Superior / HUD -->
    <header>
      <div>SALA: <span id="lbl-codigo" class="room-code">------</span></div>
      <div class="timer">TIEMPO: <span id="lbl-tiempo">60:00</span></div>
      <div>ROL: <span id="lbl-rol" style="color:#70a1ff;">NINGUNO</span></div>
    </header>

    <!-- Área Principal de Pantallas -->
    <div id="main-stage">
      
      <!-- Pantalla 1: Menú Inicial -->
      <div id="screen-menu" class="screen active">
        <h1 style="color: #ff4757; font-size: 20px; margin-bottom: 20px;">ESCAPE ROOM 16-BIT</h1>
        <input type="text" id="txt-codigo" placeholder="CÓDIGO DE SALA" maxlength="10">
        <div>
          <button class="btn-pixel green" onclick="unirseASala()">UNIRSE A SALA</button>
          <button class="btn-pixel" onclick="crearSala()">CREAR SALA</button>
        </div>
      </div>

      <!-- Pantalla 2: Sala de Juego (Canvas 16-bit) -->
      <div id="screen-game" class="screen">
        <canvas id="gameCanvas" width="800" height="380" style="background: #000; border: 2px solid #fff;"></canvas>
      </div>

    </div>

    <!-- Barra Inferior / Inventario y Logs -->
    <footer>
      <div class="inventory-panel">
        <div class="inventory-title">INVENTARIO</div>
        <div class="inventory-slots">
          <div class="slot" id="slot-1"></div>
          <div class="slot" id="slot-2"></div>
          <div class="slot" id="slot-3"></div>
          <div class="slot" id="slot-4"></div>
        </div>
      </div>
      <div class="log-panel" id="log-box">
        > Sistema iniciado...<br>
        > Esperando conexión a sala...
      </div>
    </footer>
  </div>

  <script>
    // Navegación simple entre pantallas para probar la interfaz
    function unirseASala() {
      const codigo = document.getElementById('txt-codigo').value;
      if (!codigo) return alert('Ingresa un código válido');
      
      document.getElementById('lbl-codigo').innerText = codigo.toUpperCase();
      document.getElementById('screen-menu').classList.remove('active');
      document.getElementById('screen-game').classList.add('active');
      
      logAccion("Te has unido a la sala: " + codigo);
      iniciarCanvasDemo();
    }

    function crearSala() {
      const codigoRandom = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('txt-codigo').value = codigoRandom;
      unirseASala();
    }

    function logAccion(mensaje) {
      const box = document.getElementById('log-box');
      box.innerHTML += `<br>> ${mensaje}`;
      box.scrollTop = box.scrollHeight;
    }

    // Dibujo preliminar en Canvas de estilo 16 bits
    function iniciarCanvasDemo() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // Fondo de habitación en pixel art
      ctx.fillStyle = '#2f3542';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Dibujar piso
      ctx.fillStyle = '#57606f';
      ctx.fillRect(0, 300, canvas.width, 80);

      // Puerta
      ctx.fillStyle = '#834c32';
      ctx.fillRect(360, 180, 80, 120);
      ctx.fillStyle = '#eccc68';
      ctx.fillRect(420, 240, 8, 8); // Pomo pixelado

      // Pista/Mensaje en pantalla
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px "Press Start 2P"';
      ctx.fillText("Interactúa con la puerta o busca pistas...", 180, 50);
    }
  </script>
</body>
</html>
