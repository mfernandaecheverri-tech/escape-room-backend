<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor Escape Room</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --danger: #ef4444;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    h1, h2 { text-align: center; color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea, select {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text);
    }

    button {
      padding: 10px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background-color: var(--primary-hover); }

    .btn-warning {
      background-color: var(--warning);
      padding: 5px 8px;
      font-size: 12px;
      margin-right: 4px;
    }
    .btn-warning:hover { background-color: var(--warning-hover); }

    .btn-danger {
      background-color: var(--danger);
      padding: 5px 8px;
      font-size: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th { background-color: #0f172a; }

    .section-title {
      border-bottom: 2px solid var(--primary);
      padding-bottom: 5px;
      margin-top: 40px;
    }

    .actions-cell {
      display: flex;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Control General de Escape Room</h1>

    <!-- SECCIÓN 1: JUEGOS -->
    <h2 class="section-title">1. Gestión de Juegos</h2>
    <div class="grid">
      <div class="card">
        <h3 id="form-juego-title">Agregar Juego</h3>
        <form id="form-juego">
          <input type="hidden" id="juego-id">
          <input type="text" id="juego-titulo" placeholder="Título" required>
          <textarea id="juego-desc" placeholder="Descripción"></textarea>
          <input type="number" id="juego-tiempo" placeholder="Tiempo Límite (min)" required>
          <input type="number" id="juego-min" placeholder="Mín. Jugadores" required>
          <input type="number" id="juego-max" placeholder="Máx. Jugadores" required>
          <button type="submit" id="btn-guardar-juego">Guardar Juego</button>
          <button type="button" id="btn-cancelar-juego" style="display:none; background-color:#64748b;" onclick="resetFormJuego()">Cancelar Edición</button>
        </form>
      </div>

      <div class="card">
        <h3>Lista de Juegos</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-juegos"></tbody>
        </table>
      </div>
    </div>

    <!-- SECCIÓN 2: ROLES DE JUEGO -->
    <h2 class="section-title">2. Gestión de Roles de Juego</h2>
    <div class="grid">
      <div class="card">
        <h3>Agregar Rol a Juego</h3>
        <form id="form-rol">
          <select id="rol-juego-id" required>
            <option value="">Selecciona un Juego...</option>
          </select>
          <input type="text" id="rol-nombre" placeholder="Nombre del Rol (ej: Hacker)" required>
          <textarea id="rol-desc" placeholder="Descripción del Rol"></textarea>
          <button type="submit">Guardar Rol</button>
        </form>
      </div>

      <div class="card">
        <h3>Lista de Roles</h3>
        <table>
          <thead>
            <tr>
              <th>Rol</th>
              <th>Juego</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-roles"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '';
    let juegosData = [];

    // CARGAR JUEGOS Y LLENAR TABLA Y SELECT
    async function cargarJuegos() {
      const res = await fetch(`${API_URL}/api/juegos`);
      juegosData = await res.json();
      
      const tbody = document.getElementById('tabla-juegos');
      const select = document.getElementById('rol-juego-id');
      
      tbody.innerHTML = '';
      select.innerHTML = '<option value="">Selecciona un Juego...</option>';

      juegosData.forEach(j => {
        tbody.innerHTML += `
          <tr>
            <td>${j.id}</td>
            <td><b>${j.titulo}</b></td>
            <td class="actions-cell">
              <button class="btn-warning" onclick="prepararEditarJuego(${j.id})">Editar</button>
              <button class="btn-danger" onclick="eliminarJuego(${j.id})">Desactivar</button>
            </td>
          </tr>
        `;
        select.innerHTML += `<option value="${j.id}">${j.titulo}</option>`;
      });
    }

    // PREPARAR FORMULARIO PARA EDITAR
    function prepararEditarJuego(id) {
      const juego = juegosData.find(j => j.id === id);
      if (!juego) return;

      document.getElementById('juego-id').value = juego.id;
      document.getElementById('juego-titulo').value = juego.titulo;
      document.getElementById('juego-desc').value = juego.descripcion || '';
      document.getElementById('juego-tiempo').value = juego.tiempo_limite_minutos;
      document.getElementById('juego-min').value = juego.min_jugadores;
      document.getElementById('juego-max').value = juego.max_jugadores;

      document.getElementById('form-juego-title').innerText = 'Editar Juego #' + juego.id;
      document.getElementById('btn-guardar-juego').innerText = 'Actualizar Juego';
      document.getElementById('btn-cancelar-juego').style.display = 'block';
    }

    // RESETEAR FORMULARIO DE JUEGO
    function resetFormJuego() {
      document.getElementById('form-juego').reset();
      document.getElementById('juego-id').value = '';
      document.getElementById('form-juego-title').innerText = 'Agregar Juego';
      document.getElementById('btn-guardar-juego').innerText = 'Guardar Juego';
      document.getElementById('btn-cancelar-juego').style.display = 'none';
    }

    // CARGAR ROLES Y LLENAR TABLA
    async function cargarRoles() {
      const res = await fetch(`${API_URL}/api/roles-juego`);
      const roles = await res.json();
      
      const tbody = document.getElementById('tabla-roles');
      tbody.innerHTML = '';

      roles.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td><b>${r.nombre_rol}</b></td>
            <td>${r.nombre_juego}</td>
            <td><button class="btn-danger" onclick="eliminarRol(${r.id})">Borrar</button></td>
          </tr>
        `;
      });
    }

    // GUARDAR O ACTUALIZAR JUEGO (POST / PUT)
    document.getElementById('form-juego').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('juego-id').value;
      const data = {
        titulo: document.getElementById('juego-titulo').value,
        descripcion: document.getElementById('juego-desc').value,
        tiempo_limite_minutos: document.getElementById('juego-tiempo').value,
        min_jugadores: document.getElementById('juego-min').value,
        max_jugadores: document.getElementById('juego-max').value
      };

      if (id) {
        // Modo PUT (Editar)
        await fetch(`${API_URL}/api/juegos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } else {
        // Modo POST (Crear)
        await fetch(`${API_URL}/api/juegos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      }

      resetFormJuego();
      cargarJuegos();
    });

    // AGREGAR ROL
    document.getElementById('form-rol').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch(`${API_URL}/api/roles-juego`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          juego_id: document.getElementById('rol-juego-id').value,
          nombre_rol: document.getElementById('rol-nombre').value,
          descripcion: document.getElementById('rol-desc').value
        })
      });
      e.target.reset();
      cargarRoles();
    });

    // ELIMINAR JUEGO
    async function eliminarJuego(id) {
      if(confirm('¿Desactivar este juego?')) {
        await fetch(`${API_URL}/api/juegos/${id}`, { method: 'DELETE' });
        cargarJuegos();
      }
    }

    // ELIMINAR ROL
    async function eliminarRol(id) {
      if(confirm('¿Eliminar este rol?')) {
        await fetch(`${API_URL}/api/roles-juego/${id}`, { method: 'DELETE' });
        cargarRoles();
      }
    }

    // INICIALIZAR
    cargarJuegos();
    cargarRoles();
  </script>
</body>
</html>
